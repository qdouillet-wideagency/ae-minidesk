version: '3.9'

# ⚠️ BUG #5 : le port exposé sur l'hôte est 8080, mais le service nginx écoute
#             sur le port 80 à l'intérieur du container.
#             Le mapping "8080:8080" est incorrect — corrigez-le.

services:

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080 | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"ok\"'"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  php:
    build: .
    volumes:
      - ./app:/var/www/html:ro
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE:      ${DB_NAME}
      MYSQL_USER:          ${DB_USER}
      MYSQL_PASSWORD:      ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
