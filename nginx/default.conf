server {
    listen [::]:8080;
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.php;

    # Redirige tout vers index.php (routeur frontal)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # Interdit l'accès direct aux fichiers non-PHP
    location ~* \.(sql|env|md|json)$ {
        deny all;
    }

    access_log /var/log/nginx/minidesk_access.log;
    error_log  /var/log/nginx/minidesk_error.log;
}
